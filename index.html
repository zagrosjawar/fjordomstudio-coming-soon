		<!--
  Fjordom Studio – midlertidig «Kommer snart»-side (v3).
  Ingen eksterne skrifter, skript, sporing eller informasjonskapsler.
  FØR PUBLISERING: sjekk kontaktinfo. E-postadressen står 3 steder (søk etter "hei@fjordomstudio.no"),
  telefonnummeret 2 steder (søk etter "90406055" og "904 06 055").
-->
		<style>
			@font-face {
				font-family: "Figtree";
				src: url("assets/figtree-latin.woff2") format("woff2");
				font-weight: 300 900;
				font-style: normal;
				font-display: swap;
			}
			:root {
				--background: #faf7f1; /* Warm Ivory */
				--text: #171717; /* Soft Black */
				--text-heading: #3d3d3d;
				--action: #123f32; /* Forest Green */
				--accent-secondary: #f1785b; /* Warm Coral, kun pynt */
				--on-action: #ffffff;
				--border: #e2dbce;
				--pad: clamp(1.25rem, 5vw, 4.5rem);
				--logo: min(100%, 32.5rem);
				--col-gap: clamp(2.5rem, 6vw, 5.5rem);
			}
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
			html {
				-webkit-text-size-adjust: 100%;
			}
			body {
				margin: 0;
				min-height: 100vh;
				min-height: 100svh;
				display: flex;
				flex-direction: column;
				background: var(--background);
				color: var(--text);
				font-family:
					"Figtree", "Avenir Next", "Segoe UI", "Helvetica Neue", Arial,
					sans-serif;
				font-size: 0.875rem;
				line-height: 1.625rem;
				overflow-x: hidden;
			}
			.inner {
				width: 100%;
				max-width: 90rem;
				margin-inline: auto;
				padding-inline: var(--pad);
			}
			p,
			h1 {
				margin: 0;
			}

			/* ---------- Himmel ---------- */
			.sky {
				padding-top: clamp(1.5rem, 3vw, 2.5rem);
			}
			.topline {
				display: flex;
				flex-wrap: wrap;
				justify-content: space-between;
				gap: 0.25rem 1.5rem;
			}
			.status {
				display: inline-flex;
				align-items: center;
				gap: 0.625rem;
				font-weight: 600;
			}
			.status::before {
				content: "";
				width: 0.5rem;
				height: 0.5rem;
				border-radius: 50%;
				background: var(--accent-secondary);
			}

			.hero {
				display: grid;
				gap: clamp(2.5rem, 8vw, 3.5rem);
				padding-top: clamp(2.5rem, 7vw, 4.5rem);
			}
			h1 {
				font-size: clamp(2.125rem, 1.45rem + 3vw, 3.25rem);
				line-height: 1.19;
				font-weight: 400;
				letter-spacing: -0.02em;
				color: var(--text-heading);
				text-wrap: balance;
			}
			.sub {
				margin-top: 1.5rem;
				font-size: 1.25rem;
				line-height: 1.875rem;
				color: var(--text-heading);
			}

			/* Logoen står på vannlinjen: bunnen av F-en møter det grønne vannet. */
			.logo,
			.reflection svg {
				display: block;
				width: var(--logo);
				height: auto;
				aspect-ratio: 2092 / 816;
			}
			.logo {
				margin-bottom: 2px;
			}

			/* ---------- Vann ---------- */
			.water {
				flex: 1;
				background: var(--action);
				color: var(--on-action);
				padding-bottom: clamp(3.5rem, 9vw, 7.5rem);
			}
			.water .inner {
				display: grid;
				gap: 1rem;
			}
			.reflection {
				height: clamp(5.5rem, 26vw, 12.875rem);
				overflow: hidden;
				pointer-events: none;
				user-select: none;
				-webkit-mask-image: linear-gradient(
					to bottom,
					#000 0%,
					rgba(0, 0, 0, 0.55) 45%,
					transparent 100%
				);
				mask-image: linear-gradient(
					to bottom,
					#000 0%,
					rgba(0, 0, 0, 0.55) 45%,
					transparent 100%
				);
			}
			.reflection svg {
				margin-top: 2px;
				opacity: 0.42;
				transform: scaleY(-1);
				filter: url(#krusning);
				animation: dønning 9s ease-in-out infinite alternate;
			}
			@keyframes dønning {
				from {
					transform: scaleY(-1) skewX(-0.5deg);
				}
				to {
					transform: scaleY(-1.03) skewX(0.5deg);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.reflection svg {
					animation: none;
				}
			}

			.message {
				font-size: 1.25rem;
				line-height: 1.875rem;
				max-width: 43rem;
			}
			.actions {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 0.5rem 1.5rem;
				margin-top: 1.5rem;
			}
			.button {
				display: inline-flex;
				align-items: center;
				min-height: 3.25rem;
				padding: 0.8125rem 1.375rem;
				border-radius: 0.5rem;
				background: var(--background);
				color: var(--action);
				font-weight: 600;
				text-decoration: none;
				transition: background-color 0.15s ease;
			}
			.button:hover {
				background: #ffffff;
			}
			.link {
				display: inline-flex;
				align-items: center;
				min-height: 2.75rem;
				color: var(--on-action);
				text-underline-offset: 3px;
			}
			.link:hover {
				text-decoration-thickness: 2px;
			}
			a:focus-visible {
				outline: 3px solid var(--on-action);
				outline-offset: 3px;
				border-radius: 0.25rem;
			}

			/* ---------- Bunntekst ---------- */
			footer {
				border-top: 1px solid var(--border);
				padding-block: 2rem;
			}

			@media (min-width: 60rem) {
				.hero,
				.water .inner {
					grid-template-columns: 32.5rem minmax(0, 1fr);
					column-gap: var(--col-gap);
				}
				.hero .logo {
					grid-column: 1;
					grid-row: 1;
					align-self: end;
				}
				.hero .text {
					grid-column: 2;
					grid-row: 1;
					padding-bottom: 4.5rem;
				}
				.contact {
					padding-top: 4rem;
				}
			}
		</style>
