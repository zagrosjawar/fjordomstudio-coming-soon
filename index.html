<!doctype html>
<html lang="nb">
<head>
	<meta charset="utf-8" />

	<link rel="icon" href="assets/favicon-192.png" sizes="192x192" type="image/png" />
	<link rel="apple-touch-icon" href="assets/favicon-180.png" />

	<link rel="preload" href="assets/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />

	<script src="js/main.js" defer></script>
</head>
<body>
	<!--
		KONTAKT: Lenken i «Kontakt oss» settes ett sted, i href-en under.
		Bruk bare en adresse som faktisk mottar e-post.
	-->
	<div class="page">

		<!-- Bakgrunn. Midlertidig scene i ren CSS/SVG til en lisensiert hero-poster eller -video er på plass.
		     Se README.md, «Bakgrunnsbilde og video». -->
		<div class="hero-media" aria-hidden="true">
			<svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" focusable="false">
				<defs>
					<linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
						<stop offset="0" stop-color="#16294A" />
						<stop offset=".55" stop-color="#0E1B33" />
						<stop offset="1" stop-color="#070C16" />
					</linearGradient>
					<radialGradient id="skumring" cx=".78" cy=".28" r=".55">
						<stop offset="0" stop-color="#3E6FB0" stop-opacity=".45" />
						<stop offset="1" stop-color="#3E6FB0" stop-opacity="0" />
					</radialGradient>
					<radialGradient id="lampe" cx=".08" cy=".7" r=".38">
						<stop offset="0" stop-color="#F28A3C" stop-opacity=".34" />
						<stop offset="1" stop-color="#F28A3C" stop-opacity="0" />
					</radialGradient>
					<linearGradient id="vann" x1="0" y1="0" x2="0" y2="1">
						<stop offset="0" stop-color="#0F203A" />
						<stop offset="1" stop-color="#060B15" />
					</linearGradient>
					<filter id="glod" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" /></filter>
					<filter id="speil" x="-200%" y="-20%" width="500%" height="140%"><feGaussianBlur stdDeviation="3 6" /></filter>
				</defs>
				<rect width="1600" height="900" fill="url(#himmel)" />
				<rect width="1600" height="900" fill="url(#skumring)" />
				<!-- Fjell ved vannet -->
				<path d="M640 560 C760 470 860 430 980 400 C1060 380 1110 330 1180 300 C1230 280 1270 290 1320 320 C1400 365 1500 380 1600 420 V560 Z" fill="#132744" opacity=".9" />
				<path d="M780 560 C900 500 1010 480 1120 455 C1220 432 1330 450 1440 470 C1500 480 1560 500 1600 510 V560 Z" fill="#0F203A" />
				<!-- Vann -->
				<rect y="560" width="1600" height="340" fill="url(#vann)" />
				<!-- Lys langs bryggen og speilinger -->
				<g class="lys" fill="#F6C27E" filter="url(#glod)">
					<circle cx="1060" cy="552" r="2.2" opacity=".75" /><circle cx="1100" cy="550" r="1.8" opacity=".6" />
					<circle cx="1150" cy="553" r="2.4" opacity=".8" /><circle cx="1205" cy="549" r="1.8" opacity=".55" />
					<circle cx="1255" cy="552" r="2.2" opacity=".75" /><circle cx="1310" cy="550" r="1.6" opacity=".5" />
					<circle cx="1360" cy="553" r="2.4" opacity=".8" /><circle cx="1415" cy="550" r="1.8" opacity=".6" />
					<circle cx="1470" cy="552" r="2.2" opacity=".7" /><circle cx="1530" cy="549" r="1.8" opacity=".55" />
				</g>
				<g fill="#F2B36B" opacity=".22" filter="url(#speil)">
					<rect x="1058" y="566" width="4" height="42" rx="2" /><rect x="1148" y="566" width="5" height="56" rx="2.5" />
					<rect x="1253" y="566" width="4" height="46" rx="2" /><rect x="1358" y="566" width="5" height="58" rx="2.5" />
					<rect x="1468" y="566" width="4" height="44" rx="2" />
				</g>
				<rect width="1600" height="900" fill="url(#lampe)" />
			</svg>
			<!-- Når en lisensiert video finnes, legg den her (se README.md):
			<video class="hero-video" autoplay muted loop playsinline preload="metadata"
				poster="assets/hero-poster.webp">
				<source src="assets/hero-workspace.mp4" type="video/mp4" />
			</video>
			-->
			<div class="hero-shade"></div>
		</div>

		<header class="site-header">
			<a class="brand" href="/">
				<picture>
					<source srcset="assets/logo-dark-transparent.webp" type="image/webp" />
					<img src="assets/logo-dark-transparent.png" alt="Fjordom Studio" width="720" height="312" />
				</picture>
			</a>
			<a class="contact" href="mailto:zagros.jawar@gmail.com">
				<svg class="contact-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
					<rect x="3" y="5" width="18" height="14" rx="2" />
					<path d="m4 7 8 6 8-6" />
				</svg>
				<span>Kontakt oss</span>
			</a>
		</header>

		<main class="hero">
			<p class="eyebrow">
				<span>Kommer snart</span>
				<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
			</p>
			<h1>Vi lanserer snart<span class="dot">.</span></h1>

			<ul class="services" aria-label="Tjenester">
				<li>
					<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
						<rect x="3" y="4" width="18" height="12" rx="1.5" /><path d="M8 20h8M12 16v4" /><path d="m9 12 4-4" />
					</svg>
					<span>Webdesign</span>
				</li>
				<li>
					<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
						<path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" />
					</svg>
					<span>Nettsideutvikling</span>
				</li>
				<li>
					<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
						<path d="m12 3 9 5-9 5-9-5 9-5Z" /><path d="m3 12 9 5 9-5M3 16l9 5 9-5" />
					</svg>
					<span>Logodesign</span>
				</li>
				<li>
					<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
						<circle cx="10.5" cy="10.5" r="6.5" /><path d="m15.5 15.5 5 5" />
					</svg>
					<span>SEO</span>
				</li>
			</ul>
		</main>

		<footer class="site-footer">
			<p>Fjordom Studio · Bergen, Norge</p>
		</footer>

		<!-- Bølger nederst, kun pynt -->
		<svg class="waves" viewBox="0 0 1600 220" preserveAspectRatio="none" aria-hidden="true" focusable="false">
			<defs>
				<linearGradient id="bolge1" x1="0" y1="0" x2="1" y2="0">
					<stop offset="0" stop-color="#056CF2" stop-opacity=".55" />
					<stop offset=".55" stop-color="#0754B8" stop-opacity=".25" />
					<stop offset="1" stop-color="#056CF2" stop-opacity=".6" />
				</linearGradient>
				<linearGradient id="bolge2" x1="0" y1="0" x2="1" y2="0">
					<stop offset="0" stop-color="#0754B8" stop-opacity=".7" />
					<stop offset=".6" stop-color="#052F69" stop-opacity=".5" />
					<stop offset="1" stop-color="#BF05F2" stop-opacity=".22" />
				</linearGradient>
			</defs>
			<path d="M0 90 C220 40 420 60 620 120 C820 180 1040 200 1260 150 C1400 118 1500 80 1600 70 V220 H0 Z" fill="url(#bolge1)" />
			<path d="M0 150 C260 110 460 130 700 175 C920 215 1180 205 1380 165 C1470 148 1540 135 1600 132 V220 H0 Z" fill="url(#bolge2)" />
			<path d="M0 90 C220 40 420 60 620 120 C820 180 1040 200 1260 150 C1400 118 1500 80 1600 70" fill="none" stroke="#05DBF2" stroke-opacity=".35" stroke-width="1.5" vector-effect="non-scaling-stroke" />
		</svg>
	</div>
</body>
</html>
